<svg width="100%" viewBox="0 0 380 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Control and measurement block diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  :root { --ink:#24292f; }
  @media (prefers-color-scheme: dark) { :root { --ink:#c9d1d9; } }
  .box { fill:none; stroke:var(--ink); stroke-width:1; }
  .wire { fill:none; stroke:var(--ink); stroke-width:1.5; }
  text { font-family: Arial, Helvetica, sans-serif; fill:var(--ink); }
  .t { font-size:13px; font-weight:600; }
  .s { font-size:11px; }
</style>
<defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="40" width="140" height="56" rx="8" class="box"/>
<text x="110" y="62" text-anchor="middle" class="t">INA226</text>
<text x="110" y="80" text-anchor="middle" class="s">measures V &amp; I</text>

<rect x="200" y="40" width="140" height="56" rx="8" class="box"/>
<text x="270" y="62" text-anchor="middle" class="t">POT2 (Imax)</text>
<text x="270" y="80" text-anchor="middle" class="s">sets current limit</text>

<rect x="110" y="150" width="160" height="56" rx="8" class="box"/>
<text x="190" y="172" text-anchor="middle" class="t">MCU (Nano)</text>
<text x="190" y="190" text-anchor="middle" class="s">control logic</text>

<rect x="40" y="260" width="140" height="56" rx="8" class="box"/>
<text x="110" y="282" text-anchor="middle" class="t">Displays</text>
<text x="110" y="300" text-anchor="middle" class="s">voltage + current</text>

<rect x="200" y="260" width="140" height="56" rx="8" class="box"/>
<text x="270" y="282" text-anchor="middle" class="t">LED indicators</text>
<text x="270" y="300" text-anchor="middle" class="s">load level</text>

<path d="M110,96 L110,125 L150,125 L150,150" fill="none" class="wire" marker-end="url(#a2)"/>
<path d="M270,96 L270,125 L230,125 L230,150" fill="none" class="wire" marker-end="url(#a2)"/>
<path d="M150,206 L150,235 L110,235 L110,260" fill="none" class="wire" marker-end="url(#a2)"/>
<path d="M230,206 L230,235 L270,235 L270,260" fill="none" class="wire" marker-end="url(#a2)"/>
</svg>
