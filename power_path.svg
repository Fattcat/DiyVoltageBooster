<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Power path block diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  :root { --ink:#24292f; }
  @media (prefers-color-scheme: dark) { :root { --ink:#c9d1d9; } }
  .box { fill:none; stroke:var(--ink); stroke-width:1; }
  .wire { fill:none; stroke:var(--ink); stroke-width:1.5; }
  text { font-family: Arial, Helvetica, sans-serif; fill:var(--ink); }
  .t { font-size:13px; font-weight:600; }
  .s { font-size:11px; }
</style>
<defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="40" width="110" height="56" rx="8" class="box"/>
<text x="95" y="62" text-anchor="middle" class="t">Input Vin</text>
<text x="95" y="80" text-anchor="middle" class="s">9–24 V DC</text>

<rect x="164" y="40" width="150" height="56" rx="8" class="box"/>
<text x="239" y="62" text-anchor="middle" class="t">Boost converter</text>
<text x="239" y="80" text-anchor="middle" class="s">L, MOSFET, diode</text>

<rect x="328" y="40" width="160" height="56" rx="8" class="box"/>
<text x="408" y="62" text-anchor="middle" class="t">Protection MOSFET</text>
<text x="408" y="80" text-anchor="middle" class="s">cuts off if I &gt; Imax</text>

<rect x="502" y="40" width="135" height="56" rx="8" class="box"/>
<text x="569" y="62" text-anchor="middle" class="t">Output</text>
<text x="569" y="80" text-anchor="middle" class="s">0–30 V, up to 6 A</text>

<rect x="154" y="140" width="170" height="56" rx="8" class="box"/>
<text x="239" y="162" text-anchor="middle" class="t">POT1 (voltage)</text>
<text x="239" y="180" text-anchor="middle" class="s">sets output V</text>

<line x1="150" y1="68" x2="164" y2="68" class="wire" marker-end="url(#a1)"/>
<line x1="314" y1="68" x2="328" y2="68" class="wire" marker-end="url(#a1)"/>
<line x1="488" y1="68" x2="502" y2="68" class="wire" marker-end="url(#a1)"/>
<line x1="239" y1="140" x2="239" y2="96" class="wire" marker-end="url(#a1)"/>
</svg>
